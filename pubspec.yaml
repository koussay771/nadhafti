name: nadhafti
description: On-demand home cleaning booking app for Monastir, Tunisia.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.1.0
  hooks_riverpod: ^3.1.0
  flutter_hooks: ^0.21.2
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.9.1

  # Environment / secrets
  flutter_dotenv: ^5.2.1

  # Local storage / caching
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  shared_preferences: ^2.3.5

  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.4

  # Images
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # UX
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7
  dartz: ^0.10.1
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^4.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/
    - assets/illustrations/
    - .env
